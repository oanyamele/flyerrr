# CI gate — closes risk R-09 from docs/PROJECT_RESET_REPORT.md
#
# After merging, enable branch protection on `main` and require the "verify" check:
#   Settings → Branches → Add rule → Require status checks to pass → verify

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flyerrr_test
          POSTGRES_USER: flyerrr
          POSTGRES_PASSWORD: flyerrr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flyerrr -d flyerrr_test"
          --health-interval 2s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      # The project requires Node >= 20 (Vite 5, ESLint 9).
      # It fails outright on Node 16 — see risk R-12.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: npx eslint .

      - name: Test
        run: npm test

      - name: API integration tests
        run: bun run test:api
        env:
          TEST_DATABASE_URL: postgres://flyerrr:flyerrr_test@127.0.0.1:5432/flyerrr_test

      - name: Install browser
        run: bunx playwright install --with-deps chromium

      - name: Bookmark browser tests
        run: bun run test:bookmarks:browser
        env:
          TEST_DATABASE_URL: postgres://flyerrr:flyerrr_test@127.0.0.1:5432/flyerrr_test

      - name: Build
        run: npm run build

      - name: Report bundle size
        run: |
          echo "### Bundle size" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -h dist/assets/*.js dist/assets/*.css >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Currently 11 vulnerabilities (10 high) — see R-13.
      # Tighten to `--audit-level=high` without continue-on-error once resolved.
      - run: npm audit --production --audit-level=high
        continue-on-error: true

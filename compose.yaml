services:
  db:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_DB: flyerrr
      POSTGRES_USER: flyerrr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flyerrr_dev}
    volumes:
      - flyerrr_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flyerrr -d flyerrr"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  flyerrr_data:
